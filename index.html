    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully route benign [vite] websocket notices to console.warn to prevent false-positive error triggers
      (function() {
        var _err = console.error;
        console.error = function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && (arguments[0].indexOf('[vite]') !== -1 || arguments[0].indexOf('vite:') !== -1)) {
            console.warn.apply(console, arguments);
            return;
          }
          _err.apply(console, arguments);
        };
      })();
    </script>
